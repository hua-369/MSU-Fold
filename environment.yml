# MSU-Fold 复现环境（python 3.9 + torch 2.8.0 / CUDA 12.8）
#
#   conda env create -f environment.yml
#   conda activate MSU-Fold
#
# 该环境同时覆盖：数据生成（SoftGym/PyFlex 的 python 侧）、训练、闭环仿真评估、
# 技能推理与异步推理服务。PyFlex 本体需另外编译，见 deps/README.md。
